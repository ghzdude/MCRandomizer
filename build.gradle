plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'java'
}

findProject(':modules')?.subprojects {
    setProperty('mod_version', mod_version)
    group = mod_group_id

    base {
        archivesName = mod_id
    }

    if (!name.startsWith("common")) {
        dependencies {
            implementation project("modules:common")
        }
    }
}
